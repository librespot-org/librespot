// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.contentagnostic.v2;

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.contentagnostic.v2";

message IdentityTrait {
    string type = 1;
    string name = 2;
    repeated ContributorReference contributors = 5;
    
    oneof _description {
        string description = 3;
    }
    
    oneof _content_hierarchy_parent {
        EntityReference content_hierarchy_parent = 4;
    }
}

message ContributorReference {
    string name = 1;
    
    oneof _uri {
        string uri = 2;
    }
}

message EntityReference {
    string name = 1;
    string uri = 2;
}
