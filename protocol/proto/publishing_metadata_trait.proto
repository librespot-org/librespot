// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.contentagnostic.v2;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.contentagnostic.v2";

message PublishingMetadataTrait {
    TimestampOfVaryingGranularity first_published_at = 1;
    google.protobuf.Timestamp published_on_spotify_at = 2;
    google.protobuf.Timestamp last_modified_at = 3;
    repeated string copyright_information = 4;
}

message TimestampOfVaryingGranularity {
    oneof timestamp {
        Year year = 1;
        YearMonth year_and_month = 2;
        YearMonthDay year_month_and_day = 3;
    }
}

message Year {
    int32 year = 1;
}

message YearMonth {
    int32 year = 1;
    int32 month = 2;
}

message YearMonthDay {
    int32 year = 1;
    int32 month = 2;
    int32 day = 3;
}
