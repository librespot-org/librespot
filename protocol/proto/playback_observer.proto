// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.restrictions.proto;

option optimize_for = CODE_SIZE;

message PlaybackObserverObservedState {
    string playback_id = 1;
    string uri = 2;
    string uid = 3;
    map<string, string> metadata = 4;
}

message PlaybackObserver {
    PlaybackObserverObservedState observed_state = 1;
    int64 accumulated_consumption = 2;
}
