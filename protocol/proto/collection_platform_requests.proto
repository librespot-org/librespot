// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.collection_platform.proto;

import "collection_platform_items.proto";

option objc_class_prefix = "ESP";
option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.collection_platform.esperanto.proto";

message CollectionPlatformItemsRequest {
    CollectionSet set = 1;
    repeated string items = 2;
    repeated CollectionPlatformItem collection_items = 3;
    bool include_item_data = 4;
}

enum CollectionSet {
    UNKNOWN = 0;
    IGNOREINRECS = 4;
    BANNED_ARTISTS = 8;
    CONCERTS = 10;
    PRERELEASE = 12;
    MARKED_AS_FINISHED = 13;
    NOT_INTERESTED = 14;
    PAGE_MATCH = 16;
    HIDDEN_FROM_HOME = 17;
    ISBN_SCAN = 18;
    RATINGS = 19;
}
