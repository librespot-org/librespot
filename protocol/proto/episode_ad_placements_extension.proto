// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.fingerprintfilterservice;

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_outer_classname = "EpisodeAdPlacementsProto";
option java_package = "com.spotify.fingerprintfilterservice";

message EpisodeAdPlacements {
    int32 audio_duration_ms = 1;
    repeated AdPlacement placements = 2;
    string audio_uri = 4;
    
    oneof _fingerprints_cdn_url {
        string fingerprints_cdn_url = 3;
    }
}

message AdPlacement {
    int32 start_ms = 1;
    int32 duration_ms = 2;
    int32 roll_position = 3;
}
