// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.event_sender.proto;

option optimize_for = CODE_SIZE;

message EventCounters {
    int32 file_format_version = 1;
    map<string, Counters> event_name_to_counters_map = 2;
    
    message Counters {
        repeated int32 counters = 1;
    }
}
