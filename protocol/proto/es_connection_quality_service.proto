syntax = "proto3";

package spotify.connectivity.connection_quality.esperanto.proto;

import "google/protobuf/empty.proto";

option optimize_for = CODE_SIZE;
option java_package = "com.spotify.connectivity.quality.esperanto.proto";

service ConnectionQualityService {
    rpc listenToConnectionQualityEvents(google.protobuf.Empty) returns (stream ConnectionQualityEvent);
}

message ConnectionQualityEvent {
    ConnectionQuality connection_quality = 1;
    ConnectionQuality last_known_quality = 2;
}

enum ConnectionQuality {
