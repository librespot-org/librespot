// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.contentagnostic.v2;

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.contentagnostic.v2";

message PlaybackExperienceTrait {
    ControlsMode mode = 1;
    enum ControlsMode {
        CONTROLS_MODE_UNSPECIFIED = 0;
        CONTROLS_MODE_MUSIC = 1;
        CONTROLS_MODE_TALK = 2;
    }
    
    repeated ControlsModeOverride override = 2;
    enum ControlsModeOverride {
        CONTROLS_MODE_OVERRIDE_UNSPECIFIED = 0;
        CONTROLS_MODE_OVERRIDE_CHAPTER_SKIP_ENABLED = 1;
        CONTROLS_MODE_OVERRIDE_NPV_CONTENT_LAYER_TAP_SKIP_15S = 2;
    }
    
    PlaybackSpeedMode speed_mode = 3;
    enum PlaybackSpeedMode {
        SPEED_MODE_UNSPECIFIED = 0;
        SPEED_MODE_MUSIC = 1;
        SPEED_MODE_TALK = 2;
    }
}
