// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto2";

package spotify.event_sender.proto;

option optimize_for = CODE_SIZE;

message PuffinError {
    optional bytes playback_id = 1;
    optional int64 error_code = 2;
    optional string dar_md5_0 = 3;
    optional string dar_md5_1 = 4;
    optional string dar_md5_2 = 5;
    optional int32 channels = 6;
    optional int32 sample_rate = 7;
    optional int32 block_size = 8;
    optional string api_call = 9;
    optional string context = 10;
}
