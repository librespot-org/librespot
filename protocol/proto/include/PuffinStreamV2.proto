// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto2";

package spotify.event_sender.proto;

option optimize_for = CODE_SIZE;

message PuffinStreamV2 {
    optional bytes playback_id = 1;
    optional bool specific_enabled = 2;
    optional string specific_type = 3;
    optional bool generic_enabled = 4;
    optional string generic_type = 5;
}
