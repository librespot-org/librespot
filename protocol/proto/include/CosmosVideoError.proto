// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto2";

package spotify.event_sender.proto;

option optimize_for = CODE_SIZE;

message CosmosVideoError {
    optional bytes playback_rendering_id = 1;
    optional string playback_stack = 2;
    optional string error_type = 3;
    optional string error_reason = 4;
    optional string error_message = 5;
    optional int32 ms_position_diff = 6;
}
