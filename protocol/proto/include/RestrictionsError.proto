// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto2";

package spotify.event_sender.proto;

option optimize_for = CODE_SIZE;

message RestrictionsError {
    optional string type = 1;
    optional string message = 2;
    
    repeated Data data = 3;
    message Data {
