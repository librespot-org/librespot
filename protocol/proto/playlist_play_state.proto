// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playlist.proto;

option optimize_for = CODE_SIZE;

message NavigationHistory {
    repeated string prev_items = 1;
    repeated string next_items = 2;
}

message PlayState {
    oneof _shuffle_state {
        ShuffleState shuffle_state = 1;
    }
    
    message ShuffleState {
        ShuffleType type = 1;
        enum ShuffleType {
            NONE = 0;
            NORMAL_SHUFFLE = 1;
            SMART_SHUFFLE = 2;
        }
        
        oneof _head_uid {
            string head_uid = 3;
        }
        
        oneof _shuffle_seed {
            string shuffle_seed = 4;
        }
        
        oneof _navigation_history {
            NavigationHistory navigation_history = 5;
        }
        
        reserved 2;
    }
}
