// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.automix.proto;

option optimize_for = CODE_SIZE;

message AutomixMode {
    AutomixStyle style = 1;
}

enum AutomixStyle {
    NONE = 0;
    DEFAULT = 1;
    REGULAR = 2;
    AIRBAG = 3;
    RADIO_AIRBAG = 4;
    SLEEP = 5;
    MIXED = 6;
    CUSTOM = 7;
    HEURISTIC = 8;
    BACKEND = 9;
    PRO = 10;
    CUT = 11;
    CROSSFADE = 12;
    EXPLICIT_NONE = 13;
    RADIO = 14;
    AUTO = 15;
}
