// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.curation_state.proto;

option optimize_for = CODE_SIZE;

message CuratedPlaylistItem {
    string item_uri = 1;
    bytes item_id = 2;
}

message CuratedPlaylist {
    repeated CuratedPlaylistItem item = 1;
    bytes revision = 2;
}
