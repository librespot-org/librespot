// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playlist_esperanto.proto;

import "response_status.proto";

option objc_class_prefix = "ESP";
option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "spotify.playlist.esperanto.proto";

message LensDefinition {
    string identifier = 1;
    bool active = 2;
    bool remove_by_prefix = 3;
}

message PlaylistLensRequest {
    string uri = 1;
    repeated LensDefinition lenses = 2;
}

message PlaylistLensResponse {
    ResponseStatus status = 1;
}
