// Extracted from: Spotify 1.2.52.442 (windows)

syntax = "proto3";

package spotify.collection.proto.v2;

option optimize_for = CODE_SIZE;
option java_package = "com.spotify.collection2.v2.proto";

message PageRequest {
    string username = 1;
    string set = 2;
    string pagination_token = 3;
    int32 limit = 4;
}

message CollectionItem {
    string uri = 1;
    // Seconds since the Unix epoch. Spotify 1.3.4 declares it int64; the
    // varint encoding is the same as the int32 of earlier versions.
    int64 added_at = 2;
    bool is_removed = 3;
    optional string context_uri = 4;
    // Fields 5 and below are from Spotify 1.3.4 (linux).
    optional ItemData item_data = 5;
}

// What a set records about an item beyond its URI. Only the variant for the
// `playcontextbans` set is declared here.
message ItemData {
    oneof data {
        PlayContextBansItemData play_context_bans_item_data = 1001;
    }
}

// A track hidden in one playlist or other context: the `playcontextbans` set
// holds one item per hidden track, with the context in `context_uri`.
message PlayContextBansItemData {
    ItemProvider item_provider = 1;
}

// Which part of a context offered the hidden track.
enum ItemProvider {
    PROVIDER_UNSPECIFIED = 0;
    PROVIDER_CONTEXT = 1;
    PROVIDER_AUTOPLAY = 2;
    PROVIDER_ENHANCE = 3;
}

message PageResponse {
    repeated CollectionItem items = 1;
    string next_page_token = 2;
    string sync_token = 3;
}

message DeltaRequest {
    string username = 1;
    string set = 2;
    string last_sync_token = 3;
}

message DeltaResponse {
    bool delta_update_possible = 1;
    repeated CollectionItem items = 2;
    string sync_token = 3;
}

message WriteRequest {
    string username = 1;
    string set = 2;
    repeated CollectionItem items = 3;
    string client_update_id = 4;
}

message InitializedRequest {
    string username = 1;
    string set = 2;
}

message InitializedResponse {
    bool initialized = 1;
}
