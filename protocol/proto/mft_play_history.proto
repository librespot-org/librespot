// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playlist.proto.mft_lens_poc;

import "google/protobuf/timestamp.proto";

option optimize_for = CODE_SIZE;

message PlayHistoryItem {
    string item_uri = 1;
    google.protobuf.Timestamp timestamp = 2;
}

message CurrentContext {
    string track_uri = 1;
    string context_uri = 2;
    string playback_id = 3;
    string session_id = 4;
    string track_uid = 5;
}

message PlayHistory {
    repeated PlayHistoryItem items = 1;
    CurrentContext current_context = 2;
}
