// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playlist.signal.proto;

option optimize_for = CODE_SIZE;
option java_outer_classname = "SignalModelProto";
option java_package = "com.spotify.playlist_signal.model.proto";

message Signal {
    string identifier = 1;
    bytes data = 2;
    bytes client_payload = 3;
}

message SignalData {
    string lens_identifier = 1;
    string uri = 2;
    bytes item_id = 3;
    bytes additional_data = 4;
}
