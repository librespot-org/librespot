// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.connectstate;

import "connect.proto";

option optimize_for = CODE_SIZE;
option java_package = "com.spotify.connectstate.model";

message PutStateRequestWrapper {
    string device_id = 1;
    string connection_id = 2;
    bool ignore_response = 3;
    PutStateRequest put_state_request = 4;
    
    oneof _wake_devices {
        bool wake_devices = 5;
    }
}

message SetDeviceInactiveRequest {
    string device_id = 1;
    uint64 client_side_timestamp = 3;
    
    oneof _notify_others {
        bool notify_others = 2;
    }
}

message UpdateLocalDevicesRequest {
    string reporting_device_id = 1;
    repeated LocalDevice local_devices = 2;
}

message UpdateLocalDevicesResponse {
    
}
