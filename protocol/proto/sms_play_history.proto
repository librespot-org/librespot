// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.enhancedplaylistlens;

option optimize_for = CODE_SIZE;

message HistoryItem {
    string uri = 1;
    bytes item_id = 2;
    
    oneof _start_timestamp {
        int64 start_timestamp = 3;
    }
    
    oneof _time_played_ms {
        int64 time_played_ms = 4;
    }
    
    oneof _track_length_ms {
        int64 track_length_ms = 5;
    }
}

message CurrentItem {
    string uri = 1;
    bytes item_id = 2;
    
    oneof _start_timestamp {
        int64 start_timestamp = 3;
    }
    
    oneof _time_played_ms {
        int64 time_played_ms = 4;
    }
    
    oneof _track_length_ms {
        int64 track_length_ms = 5;
    }
}

message PlayHistory {
    repeated HistoryItem history = 2;
    
    oneof _current {
        CurrentItem current = 1;
    }
}

message SignalPayload {
    PlayHistory play_history = 1;
}
