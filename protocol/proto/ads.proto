// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.ads.esperanto.proto;

import "ad_common.proto";

option objc_class_prefix = "ESP";
option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.ads.esperanto.proto";

service Ads {
    rpc GetAds(GetAdsRequest) returns (GetAdsResponse);
}

message GetAdsRequest {
    string slot_id = 1;
    map<string, string> targeting = 2;
}

message GetAdsResponse {
    map<string, AdQueue> ad_package = 1;
    string request_id = 3;
    
    oneof _error {
        string error = 2;
    }
}
