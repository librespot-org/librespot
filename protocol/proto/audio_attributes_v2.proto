// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playlistmixing.extensions.audio_attributes.v2;

option optimize_for = CODE_SIZE;
option java_outer_classname = "AudioAttributesV2Proto";
option java_package = "com.spotify.extendedmetadata.extensions.audioattributesv2impl.proto";

message AudioAttributes {
    double bpm = 1;
    
    Key key = 2;
    message Key {
        string key = 1;
        
        Mode mode = 2;
        enum Mode {
            MODE_UNKNOWN = 0;
            MODE_MINOR = 1;
            MODE_MAJOR = 2;
        }
        
        CamelotKey camelot_key = 3;
        message CamelotKey {
            string value = 1;
            string color = 2;
        }
    }
}
