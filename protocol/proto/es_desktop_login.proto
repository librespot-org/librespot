syntax = "proto3";

package spotify.desktop.login_esperanto.proto;

option optimize_for = CODE_SIZE;

service DesktopLogin {
    rpc LoginWithQRCode(LoginWithQRCodeRequest) returns (stream LoginWithQRCodeResponse);
    rpc LoginWithAccounts(LoginWithAccountsRequest) returns (LoginWithAccountsResponse);
    rpc LoginWithConnect(LoginWithConnectRequest) returns (stream LoginWithConnectResponse);
    rpc ApproveConnectLogin(ApproveConnectLoginRequest) returns (ApproveConnectLoginResponse);
    rpc Logout(LogoutRequest) returns (LogoutResponse);
    rpc GetSessionState(GetSessionStateRequest) returns (GetSessionStateResponse);
    rpc GetStoredAccounts(GetStoredAccountsRequest) returns (GetStoredAccountsResponse);
    rpc LoginWithStoredCredentials(LoginWithStoredCredentialsRequest) returns (LoginWithStoredCredentialsResponse);
    rpc SaveCurrentCredentials(SaveCurrentCredentialsRequest) returns (SaveCurrentCredentialsResponse);
    rpc ClearAllStoredCredentials(ClearAllStoredCredentialsRequest) returns (ClearAllStoredCredentialsResponse);
    rpc SetSwitchTarget(SetSwitchTargetRequest) returns (SetSwitchTargetResponse);
    rpc GetSwitchTarget(GetSwitchTargetRequest) returns (GetSwitchTargetResponse);
    rpc ClearSwitchTarget(ClearSwitchTargetRequest) returns (ClearSwitchTargetResponse);
    rpc RemoveStoredAccount(RemoveStoredAccountRequest) returns (RemoveStoredAccountResponse);
}

