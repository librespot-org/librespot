syntax = "proto3";

package spotify.puffin_esperanto.proto;

import "puffin_error_code.proto";

option objc_class_prefix = "ESP";
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.puffin_esperanto.proto";

