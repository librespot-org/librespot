// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.timekeeper_proto;

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.performancesdk.timekeeper.proto";

message TimeMeasurementBuilderSnapshot {
    string category = 1;
    repeated TimeMeasurementBuilderSnapshotCapturedPointStart captured_point_starts = 2;
    repeated TimeMeasurementBuilderSnapshotCapturedPointEnd captured_point_ends = 3;
    repeated TimeMeasurementBuilderSnapshotCapturedPoint captured_points = 4;
    map<string, string> dimensions = 6;
    map<string, string> metadata = 7;
    
    oneof _epoch_timestamp {
        uint64 epoch_timestamp = 5;
    }
}

message TimeMeasurementBuilderSnapshotCapturedPointStart {
    string identifier = 1;
    int64 timestamp = 3;
    bool is_required = 4;
    
    oneof _feature_id {
        string feature_id = 2;
    }
}

message TimeMeasurementBuilderSnapshotCapturedPointEnd {
    string identifier = 1;
    int64 timestamp = 2;
}

message TimeMeasurementBuilderSnapshotCapturedPoint {
    string identifier = 1;
    int64 timestamp = 3;
    uint64 duration = 4;
    
    oneof _feature_id {
        string feature_id = 2;
    }
}
