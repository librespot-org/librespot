// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.desktop.notifications.proto;

import "google/protobuf/empty.proto";

option optimize_for = CODE_SIZE;

service NotificationsService {
    rpc ShowToast(NotificationRequest) returns (stream NotificationResponse);
    rpc GetAvailability(google.protobuf.Empty) returns (AvailabilityResponse);
    rpc OpenNotificationsSetting(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message ToastAction {
    string label = 1;
}

message NotificationRequest {
    string title = 1;
    string body = 2;
    
    oneof _subtitle {
        string subtitle = 3;
    }
    
    oneof _action {
        ToastAction action = 4;
    }
    
    oneof _image_url {
        string image_url = 5;
    }
    
    oneof _launch_uri {
        string launch_uri = 6;
    }
}

message NotificationResponse {
    
}

message AvailabilityResponse {
    NotificationAvailability availability = 1;
}

enum NotificationAvailability {
    AVAILABLE = 0;
    UNAUTHORIZED = 1;
    UNAVAILABLE = 2;
}
