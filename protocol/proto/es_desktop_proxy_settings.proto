// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.desktop.proxy_settings_esperanto.proto;

import "google/protobuf/empty.proto";

option optimize_for = CODE_SIZE;

service DesktopProxySettings {
    rpc GetProxySettings(google.protobuf.Empty) returns (ProxySettings);
    rpc SetProxySettings(ProxySettings) returns (google.protobuf.Empty);
}

message ProxySettings {
    ProxyOption mode = 1;
    
    oneof _addr {
        string addr = 2;
    }
    
    oneof _user {
        string user = 3;
    }
    
    oneof _pass {
        string pass = 4;
    }
}

enum ProxyOption {
    AUTO = 0;
    NONE = 1;
    HTTP = 2;
    SOCKS4 = 3;
    SOCKS5 = 4;
}
