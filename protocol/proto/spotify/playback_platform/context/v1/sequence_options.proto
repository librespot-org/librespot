// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playback_platform.context.v1;

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "spotify.playback_platform.context.v1";

message SequenceOptions {
    oneof _shuffling_sequence {
        bool shuffling_sequence = 1;
    }
    
    oneof _enhancing_sequence {
        bool enhancing_sequence = 2;
    }
    
    oneof _repeating_sequence {
        bool repeating_sequence = 3;
    }
    
    oneof _repeating_timeline {
        bool repeating_timeline = 4;
    }
}
