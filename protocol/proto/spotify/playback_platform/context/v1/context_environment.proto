// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playback_platform.context.v1;

import "spotify/playback_platform/context/v1/sequence_options.proto";
import "spotify/playback_platform/context/v1/sequence_patch.proto";

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "spotify.playback_platform.context.v1";

message ContextEnvironment {
    SequenceOptions sequence_options = 1;
    
    LegacySkipToTrack skip_to = 2 [deprecated = true];
    message LegacySkipToTrack {
        oneof _uid {
            string uid = 1;
        }
        
        oneof _context_id {
            string context_id = 2;
        }
        
        oneof _item_index {
            string item_index = 3;
        }
        
        reserved 4, 5;
        
        reserved "page_index", "page_url";
    }
    
    int32 iteration = 5;
    
    oneof _patch {
        SequencePatch patch = 4;
    }
}
