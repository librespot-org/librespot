// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playback_platform.context.v1;

import "spotify/playback_platform/common/v1/cache_control.proto";
import "spotify/playback_platform/common/v1/client.proto";
import "spotify/playback_platform/common/v1/request_error.proto";
import "spotify/playback_platform/context/v1/behavior/action.proto";
import "spotify/playback_platform/context/v1/context.proto";
import "spotify/playback_platform/context/v1/context_environment.proto";
import "spotify/playback_platform/context/v1/context_state.proto";
import "spotify/playback_platform/context/v1/ledger.proto";
import "spotify/playback_platform/context/v1/sequence_child.proto";

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "spotify.playback_platform.context.v1";

message ContextRequest {
    repeated Query queries = 1;
    message Query {
        string context_id = 1;
        Cache cache = 2;
        State state = 3;
        ContextEnvironment env = 4;
    }
    
    common.v1.Client client = 2;
    
    message Cache {
        map<string, Cache> children = 2;
        
        oneof _entity_tag {
            bytes entity_tag = 1;
        }
    }
    
    message State {
        ContextState state = 1;
        map<string, State> children = 2;
    }
}

message SequencePageRequest {
    repeated Query queries = 1;
    message Query {
        bytes page_id = 1;
        ContextRequest.Query context_query = 2;
    }
    
    common.v1.Client client = 2;
}

message ContextResponse {
    map<uint32, Result> results = 1;
    
    message Result {
        common.v1.RequestError error = 1;
        Context context = 2;
        common.v1.CacheControl cache_control = 3;
        ContextState state = 4;
        ContextEnvironment env = 5;
        map<string, Result> preloaded_children = 6;
    }
}

message SequencePageResponse {
    map<uint32, Result> results = 1;
    
    message Result {
        common.v1.RequestError error = 1;
        repeated SequenceChild children = 2;
        map<string, ContextResponse.Result> preloaded_children = 5;
        
        oneof _prev_page_id {
            bytes prev_page_id = 3;
        }
        
        oneof _next_page_id {
            bytes next_page_id = 4;
        }
    }
}

message RemoteActionRequest {
    string context_id = 1;
    ContextRequest.Query context_query = 4;
    common.v1.Client client = 5;
    Ledger ledger = 6;
    
    oneof _action_id {
        string action_id = 2;
    }
    
    oneof _parameters {
        bytes parameters = 3;
    }
}

message RemoteActionResponse {
    repeated RemoteAction actions = 1;
    common.v1.RequestError error = 2;
}

message RemoteAction {
    oneof action {
        Replace replace = 1;
        behavior.Action.Report report = 2;
        behavior.Action.Reload reload = 3;
        behavior.Action.Unload unload = 4;
        behavior.Action.Signal signal = 5;
        behavior.Action.Player player = 6;
    }
    
    message Replace {
        ContextResponse.Result result = 1;
    }
}
