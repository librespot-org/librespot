// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playback_platform.media.v1;

import "spotify/playback_platform/common/v1/client.proto";
import "spotify/playback_platform/common/v1/request_error.proto";
import "spotify/playback_platform/media/v1/manifests.proto";

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "spotify.playback_platform.media.v1";

message AudioManifestRequest {
    string format_id = 1;
    bytes media_id = 2;
    common.v1.Client client = 3;
}

message VideoManifestRequest {
    string format_id = 1;
    bytes media_id = 2;
    common.v1.Client client = 3;
}

message AudioManifestResponse {
    oneof manifest {
        TrackManifest track = 1;
        AudioManifest audio = 2;
        GeneratedAudioManifest generated = 3;
        StreamingAudioManifest streaming = 4;
        common.v1.RequestError error = 5;
    }
}

message VideoManifestResponse {
    oneof manifest {
        TrackManifest track = 1;
        VideoManifest video = 2;
        GeneratedVideoManifest generated = 3;
        StreamingVideoManifest streaming = 4;
        common.v1.RequestError error = 5;
    }
}
