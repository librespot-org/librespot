// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playback_platform.timeline.v1;

import "spotify/playback_platform/timeline/v1/timepoint.proto";
import "spotify/playback_platform/timeline/v1/timespan.proto";

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "spotify.playback_platform.timeline.v1";

message Timeline {
    repeated Timespan spans = 1;
    repeated uint64 tags = 4;
    
    oneof _duration_override {
        Timepoint duration_override = 2;
    }
    
    oneof _uid {
        string uid = 3;
    }
    
    oneof _format_id {
        string format_id = 5;
    }
}
