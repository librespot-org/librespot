// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playback_platform.timeline.v1;

import "spotify/playback_platform/common/v1/duration.proto";

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "spotify.playback_platform.timeline.v1";

message TimespanAnchor {
    oneof span {
        uint32 span_index = 1;
        string span_uid = 2;
    }
}

message TimelineAnchor {
    
}

message Timepoint {
    common.v1.Duration offset = 4;
    
    oneof anchor {
        TimespanAnchor span_begin = 1;
        TimespanAnchor span_end = 2;
        TimelineAnchor timeline_begin = 3;
    }
}

message Timepoints {
    common.v1.Durations offsets = 4;
    
    oneof anchor {
        TimespanAnchor span_begin = 1;
        TimespanAnchor span_end = 2;
        TimelineAnchor timeline_begin = 3;
    }
}
