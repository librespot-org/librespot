// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playback_platform.timeline.v1.behavior;

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "spotify.playback_platform.timeline.v1.behavior";

message Reporting {
    repeated PlayContext play_contexts = 1;
    message PlayContext {
        string uri = 1;
    }
    
    oneof _decision_id {
        string decision_id = 2;
    }
    
    oneof _custom_reporting_attribution {
        string custom_reporting_attribution = 3;
    }
    
    oneof _sequence_provider_id {
        string sequence_provider_id = 4;
    }
}
