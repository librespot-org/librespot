// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.playback_platform.timeline.v1.behavior;

import "spotify/playback_platform/common/v1/duration.proto";
import "spotify/playback_platform/timeline/v1/timepoint.proto";

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "spotify.playback_platform.timeline.v1.behavior";

message SeekSnap {
    repeated Guide guides = 1;
    message Guide {
        Timepoints snap_positions = 1;
        common.v1.Duration radius = 2;
    }
    
    oneof _cutoff {
        float cutoff = 2;
    }
}
