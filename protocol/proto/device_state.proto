syntax = "proto3";

package spotify.ads.esperanto.proto;

option objc_class_prefix = "ESP";
option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.ads.esperanto.proto";

service DeviceState {
    rpc SetDeviceVolume(SetDeviceVolumeRequest) returns (SetDeviceVolumeResponse);
    rpc GetDeviceVolume(GetDeviceVolumeRequest) returns (GetDeviceVolumeResponse);
}

message SetDeviceVolumeRequest {
    double volume = 1;
}

message SetDeviceVolumeResponse {
    Status status = 1;
    enum Status {
        ACCEPTED = 0;
        BAD_REQUEST = 1;
    }
}

