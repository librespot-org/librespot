// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto2";

package spotify.player.proto.state_restore;

option optimize_for = CODE_SIZE;

message VideoPersistenceState {
    optional MediaType current_media_type = 1;
    enum MediaType {
        AUDIO = 1;
        VIDEO = 2;
    }
    
    optional VideoContextType video_context_type = 2;
    enum VideoContextType {
        NONE = 1;
        IS_VIDEO_FIRST = 2;
        PLAYLIST_VIDEO_TOGGLE = 3;
        IS_SINGLE_TRACK_VIDEO_CONTENT = 4 [deprecated = true];
    }
}
