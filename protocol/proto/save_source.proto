// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.list_collection.save_source.proto;

option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.list_collection.save_source.proto";

message SaveSource {
    oneof _original_uri {
        string original_uri = 1;
    }
    
    oneof _interaction_id {
        string interaction_id = 2;
    }
    
    oneof _source_tool {
        SourceTool source_tool = 3;
    }
}

enum SourceTool {
    SOURCE_TOOL_UNSPECIFIED = 0;
    SOURCE_TOOL_PROMPT = 1;
    SOURCE_TOOL_STUDIO_AGENT = 2;
}
