// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.player.esperanto.proto;

import "google/protobuf/empty.proto";

option objc_class_prefix = "ESP";
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.player.esperanto.proto";

service ContextResolveMock {
    rpc UpdateContext(ContextUpdate) returns (google.protobuf.Empty);
    rpc GetRequestInfo(RequestInfoRequest) returns (RequestInfo);
    rpc GetLastAutoplayRequestInfo(google.protobuf.Empty) returns (AutoplayRequestInfo);
}

message ContextUpdate {
    string url = 1;
    string context = 2;
}

message RequestInfoRequest {
    string url = 1;
}

message RequestInfo {
    int32 request_count = 1;
}

message AutoplayRequestInfo {
    repeated string recent_tracks = 2;
    
    oneof _context_uri {
        string context_uri = 1;
    }
}
