// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.connect.esperanto.proto;

import "common_messages.proto";

option optimize_for = CODE_SIZE;
option java_package = "com.spotify.connect.esperanto.proto";

message VolumeUpRequest {
    LoggingParams logging_params = 1;
    
    oneof _group_device_identifier {
        string group_device_identifier = 2;
    }
}

message VolumeDownRequest {
    LoggingParams logging_params = 1;
    
    oneof _group_device_identifier {
        string group_device_identifier = 2;
    }
}

message VolumeSetRequest {
    int32 volume = 1;
    LoggingParams logging_params = 2;
    
    oneof _group_device_identifier {
        string group_device_identifier = 3;
    }
}

message VolumeResponse {
    Status status = 2;
    map<string, uint32> group_device_volumes = 4;
    
    oneof _volume {
        int32 volume = 1;
    }
    
    oneof _active_device_connect_state_identifier {
        string active_device_connect_state_identifier = 3;
    }
}

message LocalVolumeResponse {
    int32 volume = 1;
    
    Reason reason = 2;
    enum Reason {
        USER = 0;
        SYSTEM = 1;
    }
}
