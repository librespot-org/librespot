// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.player.esperanto.proto;

option objc_class_prefix = "ESP";
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.player.esperanto.proto";

service SequenceRules {
    rpc skipsRemaining(RemainingSkipsRequest) returns (RemainingSkipsResponse);
    rpc resetSkips(ResetSkipsRequest) returns (ResetSkipResponse);
}

message RemainingSkipsRequest {
    
}

message ResetSkipsRequest {
    
}

message RemainingSkipsResponse {
    uint32 remaining_skips = 1;
    
    Status status = 2;
    enum Status {
        OK = 0;
        GONE = 1;
    }
}

message ResetSkipResponse {
    Status status = 1;
    enum Status {
        OK = 0;
        FORBIDDEN = 1;
    }
}
