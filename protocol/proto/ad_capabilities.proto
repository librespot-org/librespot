// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.ads.esperanto.proto;

import "google/protobuf/empty.proto";

option objc_class_prefix = "ESP";
option java_multiple_files = true;
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.ads.esperanto.proto";

service Capabilities {
    rpc addCapability(CapabilityRequest) returns (google.protobuf.Empty);
    rpc removeCapability(CapabilityRequest) returns (google.protobuf.Empty);
}

message CapabilityRequest {
    Capability capability = 1;
}

enum Capability {
    RESERVED = 0;
    AUDIO_ONLY = 1;
    DISTRACTED_DRIVER = 2;
}
