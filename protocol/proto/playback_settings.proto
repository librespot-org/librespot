// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.list_player.impl.proto;

option optimize_for = CODE_SIZE;

message PlaybackSettings {
    MediaPreference media_preference = 1;
    enum MediaPreference {
        UNSPECIFIED = 0;
        AUDIO = 1;
        VIDEO = 2;
    }
    
    bool repeat_item = 3;
    
    oneof _search_repeat_list {
        bool search_repeat_list = 4;
    }
    
    oneof _non_search_repeat_list {
        bool non_search_repeat_list = 5;
    }
}
