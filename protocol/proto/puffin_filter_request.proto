// Extracted from: Spotify 1.2.96.518 (Windows)

syntax = "proto3";

package spotify.puffin_esperanto.proto;

option objc_class_prefix = "ESP";
option optimize_for = CODE_SIZE;
option java_package = "com.spotify.puffin_esperanto.proto";

message PuffinFilterRequest {
    repeated bytes filters = 2;
    bool is_o = 3;
    bool is_v = 4;
    Reason reason = 5;
}

message PuffinDisableProcessingRequest {
    Reason reason = 1;
}

enum Reason {
    UNKNOWN = 0;
    USER_INITIATED = 1;
}
